databaseChangeLog:
  - changeSet:
      id: 001-create-delivery-order-table
      author: leila
      changes:
        - createTable:
            tableName: delivery_order
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: pickup_address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: delivery_address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: delivery_price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: courier_id
                  type: BIGINT

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false