server:
  port: 8082

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:h2:mem:orderdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    change-log: classpath:changelog-master.yaml

  cloud:
    openfeign:
      client:
        config:
          courier-service:
            url: http://localhost:8081